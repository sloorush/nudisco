# XcodeGen project spec for the nudisco macOS broadcaster.
# Generate the Xcode project with:
#   brew install xcodegen           # one time
#   cd mac && xcodegen generate     # -> NudiscoBroadcaster.xcodeproj
#   open NudiscoBroadcaster.xcodeproj
# Then set your signing Team and Run. See README.md (Spike 0 first!).
name: NudiscoBroadcaster
options:
  bundleIdPrefix: com.nudisco
  deploymentTarget:
    macOS: "14.2"          # Core Audio process taps require macOS 14.2+
  createIntermediateGroups: true

packages:
  WebRTC:
    # Same prebuilt libwebrtc the iOS listener uses (Opus, RED, NACK, NetEQ).
    # The macOS broadcaster needs the custom-audio API (RTCAudioDevice +
    # RTCPeerConnectionFactory(audioDevice:)) — see Spike 0 in README. If a future
    # tag drops/renames it, switch the url to https://github.com/webrtc-sdk/webrtc
    # (Fallback A) and keep everything else.
    url: https://github.com/stasel/WebRTC
    from: "120.0.0"
  SwiftNIO:
    # HTTP + WebSocket on ONE port (the unchanged web listener computes its socket
    # as ws://<same host:port>/ws). NIO's HTTP->WS upgrader does this cleanly;
    # Network.framework cannot. Pure-Swift, statically linked, notarizes fine.
    url: https://github.com/apple/swift-nio
    from: "2.65.0"

targets:
  NudiscoBroadcaster:
    type: application
    platform: macOS
    sources:
      - path: Nudisco-Broadcaster
        excludes:
          - "Fonts/**"              # re-added below as a folder ref for ATSApplicationFontsPath
      - path: Nudisco-Broadcaster/Fonts
        type: folder                # -> Contents/Resources/Fonts (registered via ATSApplicationFontsPath)
        buildPhase: resources
      - path: ../public
        type: folder                # bundle the UNCHANGED web listener -> Contents/Resources/public
        buildPhase: resources
    dependencies:
      - package: WebRTC
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIO
        product: NIOHTTP1
      - package: SwiftNIO
        product: NIOWebSocket
    info:
      path: Nudisco-Broadcaster/Info.plist     # generated by xcodegen from the properties below
      properties:
        CFBundleDisplayName: nudisco
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false   # only standard TLS/DTLS-SRTP — export-exempt
        NSHumanReadableCopyright: "© enchante"
        # Triggers the one-time system-audio capture permission (Core Audio taps).
        NSAudioCaptureUsageDescription: "nudisco captures your computer's audio so it can stream it to guests' phones on your Wi-Fi. It does not record or save anything."
        # macOS 15+ gates LAN access (our embedded server listens on the Wi-Fi for
        # phones/browsers) behind Local Network privacy — without this key the bind
        # fails. Mirrors the iOS app.
        NSLocalNetworkUsageDescription: "nudisco serves the live audio to guests' phones and browsers on your Wi-Fi network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true        # allow plain http/ws on the LAN if ever needed
        # Bundled Satoshi fonts (Contents/Resources/Fonts) — macOS registers these at launch.
        ATSApplicationFontsPath: Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nudisco.broadcaster
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"                    # match iOS; avoid Swift 6 strict-concurrency churn
        # stasel/WebRTC's macOS slice omits RTCAudioDevice.h; we vendor it (see
        # Vendor/NudiscoBridging.h) and expose it through the bridging header.
        SWIFT_OBJC_BRIDGING_HEADER: Nudisco-Broadcaster/Vendor/NudiscoBridging.h
        CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES            # required for notarization
        CODE_SIGN_ENTITLEMENTS: Nudisco-Broadcaster/Nudisco.entitlements
        CODE_SIGN_STYLE: Automatic
        # For website distribution the notarize.sh script re-signs with Developer ID.
        # Set your Apple Developer Team here (or pick it in Xcode > Signing):
        # DEVELOPMENT_TEAM: ABCDE12345
