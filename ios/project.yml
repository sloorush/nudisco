# XcodeGen project spec. Generate the Xcode project with:
#   brew install xcodegen        # one time
#   cd ios && xcodegen generate  # -> Nudisco.xcodeproj
#   open Nudisco.xcodeproj
# (Or set everything up manually in Xcode — see README.md.)
name: Nudisco
options:
  bundleIdPrefix: com.nudisco
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  WebRTC:
    # Maintained prebuilt libwebrtc (Opus, RED, NACK, NetEQ jitter buffer).
    # Versions track Chromium milestones and bump the MAJOR each release. If SPM
    # can't resolve this, open the package in Xcode (File ▸ Add Package
    # Dependencies ▸ https://github.com/stasel/WebRTC) and pick the latest, or
    # bump the version below to the newest tag.
    url: https://github.com/stasel/WebRTC
    from: "120.0.0"

targets:
  Nudisco:
    type: application
    platform: iOS
    sources:
      - Nudisco
    dependencies:
      - package: WebRTC
    info:
      path: Nudisco/Info.plist        # generated by xcodegen from the properties below
      properties:
        CFBundleDisplayName: nudisco
        UILaunchScreen: {}
        UIRequiresFullScreen: true       # portrait-only without the iPad multitasking warning
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # --- the keys that make this app actually work ---
        UIBackgroundModes:
          - audio                       # play with the screen LOCKED / app backgrounded
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # allow insecure ws:// + http:// on the LAN
        NSLocalNetworkUsageDescription: "nudisco connects to the DJ's computer on your Wi-Fi to stream audio."
        NSCameraUsageDescription: "Scan the join QR code shown on the DJ's screen."
        # libwebrtc's iOS audio engine initializes the mic audio unit even though
        # we only RECEIVE — iOS requires this key or the app crashes. nudisco
        # never records or transmits the microphone (it adds no local track).
        NSMicrophoneUsageDescription: "nudisco's audio engine needs microphone access to start; it never records or sends your audio."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nudisco.listener
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"            # avoid Swift 6 strict-concurrency build errors
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Set your Apple Developer Team here (or pick it in Xcode ▸ Signing):
        # DEVELOPMENT_TEAM: ABCDE12345
