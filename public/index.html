<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>nudisco 🎧</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="app listener" id="app">
    <header class="brand">
      <span class="logo">◖◗</span>
      <h1 id="title">nudisco</h1>
    </header>

    <p class="warn" id="warn" hidden></p>

    <!-- Big gesture button: required for mobile autoplay -->
    <button class="join" id="joinBtn">Tap&nbsp;to&nbsp;Join</button>

    <section class="controls" id="controls" hidden>
      <div class="statline">
        <span class="dot dot-idle" id="statusDot"></span>
        <span id="status">Idle</span>
      </div>

      <div class="latbox">
        <div class="latnum" id="latency">— ms</div>
        <div class="latlabel">estimated latency</div>
        <div class="latdetail" id="latencyDetail">—</div>
      </div>

      <label class="ctl">
        <span>Volume</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
      </label>
      <p class="hint" id="volNote" hidden>
        On iPhone/iPad use the hardware volume buttons — Safari ignores in-page volume.
      </p>

      <div class="ctl" id="bufferRow">
        <span>Buffer</span>
        <select id="bufferSelect">
          <option value="smooth">Smooth (fewest dropouts)</option>
          <option value="balanced">Balanced</option>
          <option value="low">Low latency</option>
        </select>
      </div>
      <p class="hint">If audio is choppy, keep this on <b>Smooth</b>. Lower = less delay but needs strong Wi-Fi.</p>

      <div class="ctl" id="outputRow" hidden>
        <span>Output</span>
        <select id="outputSelect"></select>
      </div>

      <button class="secondary" id="reconnectBtn">Reconnect</button>
    </section>

    <!-- Tap-to-resume overlay (iOS backgrounding / interruptions) -->
    <div class="resume" id="resume" hidden>
      <button id="resumeBtn">▶︎ Tap to resume audio</button>
    </div>

    <audio id="player" playsinline></audio>

    <footer class="foot">LAN silent disco · keep this tab open · wired earphones recommended</footer>
  </main>

  <script type="module" src="/js/listener.js"></script>
</body>
</html>
